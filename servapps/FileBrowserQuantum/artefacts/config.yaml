# FileBrowser Quantum v2.0.0+ configuration (servapp)
# Managed by the FileBrowserQuantum Cosmos servapp.
server:
  sources:
    - path: "/volumes"
      config:
        defaultEnabled: true
        defaultPermissions:
          view: true
          modify: true
          create: true
          delete: true
          download: true
      name: "ServApp Volumes"
    - path: "/host"
      config:
        defaultEnabled: true
        defaultPermissions:
          view: true
          modify: true
          create: true
          delete: true
          download: true
      name: "Host"
  database:
    path: "data/database.sqlite"          # v2 SQLite database

auth:
  methods:
    proxy:
      enabled: true
      header: "X-Cosmos-User"
      createUser: true

frontend:
  name: "Filebrowser Quantum"

userDefaults:
  preview:
    highQuality: true
    image: true
    video: true
    motionVideoPreview: true
    office: true
    popup: true
    folder: true
  fileViewer:
    disableOnlyOfficeExt: ".md .txt .pdf"
  account:
    permissions:
      admin: false
      api: false
      share: false
      realtime: false

http:
  port: 80
  trustProxyHeaders: true                # behind Cosmos reverse proxy